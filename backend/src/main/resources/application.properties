# ===============================
# APLICACIÓN
# ===============================
spring.application.name=ariana

# ===============================
# POSTGRESQL
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ariana_db}
spring.datasource.username=${DB_USERNAME:ariana}
spring.datasource.password=${DB_PASSWORD:}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# EMAIL / SMTP
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dev@ariana.local}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# EMAIL - TIMEOUTS
# ===============================
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:development-only-change-this-key-before-any-real-deployment-2026}
jwt.expiration=900000

# ===============================
# FRONTEND
# ===============================
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.email.enabled=${MAIL_ENABLED:false}

# ===============================
# SEGURIDAD - COOKIES
# ===============================
security.cookie.secure=${COOKIE_SECURE:false}

# ===============================
# PROXY / HTTPS
# ===============================
server.forward-headers-strategy=framework